<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>旅行行程入口</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✈️</text></svg>">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: #fff9f0;
    color: #6a6560;
    font-family: 'Noto Sans TC', 'Zen Maru Gothic', sans-serif;
  }
  .page { width: min(100% - 32px, 900px); margin: 0 auto; padding: 56px 0 48px; }
  .hero { text-align: center; margin-bottom: 36px; }
  .hero-icon { font-size: 3.5rem; margin-bottom: 12px; }
  h1 { margin: 0; color: #5a5550; font-size: clamp(2rem, 6vw, 3.2rem); font-weight: 900; letter-spacing: .08em; }
  .subtitle { margin: 12px 0 0; color: #b0aaa5; font-size: .95rem; }
  .trip-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
  .trip-card {
    display: flex;
    flex-direction: column;
    min-height: 300px;
    padding: 26px;
    color: inherit;
    text-decoration: none;
    background: #fff;
    border: 2px dashed #e0d8d0;
    border-radius: 24px;
    box-shadow: 0 4px 0 rgba(224,216,208,.35);
    transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease;
  }
  .trip-card:hover, .trip-card:focus-visible { transform: translateY(-5px); border-color: #7ec8a0; box-shadow: 0 9px 0 rgba(126,200,160,.2); outline: none; }
  .trip-card.busan:hover, .trip-card.busan:focus-visible { border-color: #7db8d4; box-shadow: 0 9px 0 rgba(125,184,212,.2); }
  .trip-flag { font-size: 3.5rem; line-height: 1; }
  .trip-name { margin-top: 22px; color: #5a5550; font-size: 1.55rem; font-weight: 900; }
  .trip-meta { margin-top: 7px; color: #8a8580; font-size: .9rem; }
  .trip-description { flex: 1; margin: 18px 0 22px; color: #b0aaa5; line-height: 1.8; }
  .trip-action { align-self: flex-start; padding: 8px 16px; border-radius: 999px; background: #7ec8a0; color: white; font-size: .85rem; font-weight: 700; }
  .trip-card.busan .trip-action { background: #7db8d4; }
  .footer { margin-top: 42px; text-align: center; color: #c4bdb6; font-size: .8rem; }
  @media (max-width: 480px) { .page { padding-top: 38px; } .trip-card { min-height: 260px; } }
</style>
</head>
<body>
  <div class="page">
    <header class="hero">
      <div class="hero-icon">✈️</div>
      <h1>我的旅行行程</h1>
      <p class="subtitle">選擇一趟旅程，開始查看詳細行程</p>
    </header>

    <main class="trip-grid" aria-label="已完成的旅行行程">
      <a class="trip-card busan" href="busan.html">
        <div class="trip-flag">🇰🇷</div>
        <div class="trip-name">釜山五天四夜</div>
        <div class="trip-meta">韓國・2026 / 04 / 16 ～ 2026 / 04 / 20</div>
        <p class="trip-description">海岸線、美食、咖啡街、甘川洞與廣安里夜景的完整行程規劃。</p>
        <span class="trip-action">查看釜山行程 →</span>
      </a>

      <a class="trip-card osaka" href="osaka.html">
        <div class="trip-flag">🇯🇵</div>
        <div class="trip-name">大阪四天三夜</div>
        <div class="trip-meta">日本・9 / 9 ～ 9 / 12</div>
        <p class="trip-description">大阪城、梅田、道頓堀、環球影城與大阪美食的完整行程規劃。</p>
        <span class="trip-action">查看大阪行程 →</span>
      </a>
    </main>

    <footer class="footer">未來的旅程，也會陸續加入這裡 🗺️</footer>
  </div>
</body>
</html>
